name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'release/**']

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        stack: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.15.8 }
      - uses: terraform-linters/setup-tflint@v5
        with: { tflint_version: v0.60.0 }
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=stacks/${{ matrix.stack }} init -backend=false
      - run: terraform -chdir=stacks/${{ matrix.stack }} validate
      - run: tflint --init
      - run: tflint --chdir=stacks/${{ matrix.stack }} --recursive
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.19.0 }
      - run: >-
          helm lint helm/shopport
          --set image.api.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --set image.worker.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          --set worker.queueURL=https://sqs.ap-northeast-2.amazonaws.com/000000000000/shopport-dev-image
      - run: >-
          helm template shopport helm/shopport --namespace shopport
          --set image.api.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --set image.worker.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          --set worker.queueURL=https://sqs.ap-northeast-2.amazonaws.com/000000000000/shopport-dev-image
          > rendered.yaml
      - uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          args: -strict -summary -ignore-missing-schemas /github/workspace/rendered.yaml
      - run: ruby -e 'require "yaml"; Dir["argocd/**/*.yaml"].each { |file| YAML.load_stream(File.read(file)) }'
      - run: jq empty observability/datadog/*.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
