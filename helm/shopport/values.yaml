nameOverride: ""
fullnameOverride: ""

environment: dev
appEnv: dev
awsRegion: ap-northeast-2

image:
  api:
    repository: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/shopport/api
    digest: ""
  worker:
    repository: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/shopport/worker
    digest: ""
  pullPolicy: IfNotPresent

app:
  nodeEnv: development
  providerModel: gpt-5.4-mini

serviceAccount:
  name: shopport

secrets:
  storeName: aws-secrets-manager
  runtimeRemoteKey: shopport-dev/runtime
  migrationRemoteKey: shopport-dev/migration
  credentialsRemoteKey: shopport-dev/credentials

api:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    minReplicas: 2
    maxReplicas: 20
    cpuUtilization: 65
    memoryUtilization: 75

worker:
  minReplicas: 1
  maxReplicas: 100
  queueLength: "5"
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

outboxWorker:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

ingress:
  enabled: false
  host: ""
  certificateArn: ""
  wafArn: ""

podDisruptionBudget:
  minAvailable: 1

datadog:
  enabled: true

otel:
  endpoint: http://datadog-agent.datadog.svc.cluster.local:4318
